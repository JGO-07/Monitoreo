<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Centro de monitoreo CV{% endblock %}</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#5e6878; --line:#dfe3ea; --accent:#2457c5;
        --low:#c62828; --doubt:#b26a00; --acc:#2e7d32; --info:#1565c0; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
header { background:#18213a; color:#fff; padding:10px 20px; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
header b { font-size:15px; } header a { color:#cfd8f3; text-decoration:none; } header a:hover { color:#fff; }
header a.on { color:#fff; border-bottom:2px solid #8fb0ff; }
main { max-width:1280px; margin:0 auto; padding:18px 20px 40px; }
h1 { font-size:20px; margin:6px 0 14px; } h2 { font-size:16px; margin:22px 0 8px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
table { border-collapse:collapse; width:100%; background:var(--card); }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { background:#eef1f6; font-weight:600; font-size:12.5px; color:#384152; position:sticky; top:0; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
a { color:var(--accent); }
code, .mono { font-family:ui-monospace, Consolas, monospace; font-size:12.5px; }
.badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; color:#fff; }
.z-low, .s-critical, .w-breach { background:var(--low); } .z-doubt, .s-warning { background:var(--doubt); }
.z-accepted, .w-normal, .st-resolved { background:var(--acc); } .s-info, .st-active { background:var(--info); }
.z-none, .w-insufficient, .w-skipped_partial { background:#7a8494; }
.muted { color:var(--muted); } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
form.filters { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-bottom:12px; }
form.filters label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); }
input, select, button { font:inherit; padding:5px 7px; border:1px solid #c5ccd8; border-radius:5px; background:#fff; }
button { background:var(--accent); color:#fff; border:none; cursor:pointer; padding:6px 14px; }
dl.kv { display:grid; grid-template-columns:200px 1fr; gap:4px 12px; margin:0; }
dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; word-break:break-all; }
img.thumb { width:96px; height:72px; object-fit:cover; border-radius:4px; border:1px solid var(--line); }
img.big { max-width:100%; border-radius:6px; border:1px solid var(--line); }
.bar { height:10px; background:#dbe4fb; border-radius:5px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); }
.empty { padding:18px; text-align:center; color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:8px; }
.pager { display:flex; gap:10px; margin-top:10px; align-items:center; }
pre { background:#0f1525; color:#d7e0f5; padding:12px; border-radius:6px; overflow:auto; font-size:12px; }
.gallery { display:flex; flex-wrap:wrap; gap:8px; } .gallery figure { margin:0; font-size:11px; text-align:center; }
</style>
</head>
<body>
<header>
  <b>Centro de monitoreo CV</b>
  {% set p = request.url.path %}
  <a href="/" class="{{ 'on' if p == '/' }}">Resumen</a>
  <a href="/eventos" class="{{ 'on' if p.startswith('/eventos') }}">Eventos</a>
  <a href="/alertas" class="{{ 'on' if p.startswith('/alertas') }}">Alertas</a>
  <a href="/corridas" class="{{ 'on' if p.startswith('/corridas') }}">Corridas y métricas</a>
  <a href="/metricas" class="{{ 'on' if p.startswith('/metricas') }}">Inventario de métricas</a>
  {% if live_enabled %}<a href="/en-vivo" class="{{ 'on' if p.startswith('/en-vivo') }}">En vivo</a>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
<p class="muted" style="margin-top:30px">Store: <code>{{ store_path }}</code> · Las puntuaciones son salidas del modelo, no probabilidades de acierto.</p>
</main>
</body>
</html>
